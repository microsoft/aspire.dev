version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Cover all actual project dependencies, including Aspire and Azure packages.
  # Generated documentation catalogs are not NuGet dependency manifests.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
