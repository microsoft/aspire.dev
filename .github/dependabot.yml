version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    ignore:
      # 0.2.x removed the ./git, ./console and ./status subpath exports that
      # config/lunaria-starlight.mjs and src/components/lunaria/cache.mjs use,
      # and @lunariajs/starlight 0.1.1 still depends on core ^0.1.1.
      - dependency-name: "@lunariajs/core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # TypeScript 7 (native port) drops the JS compiler API that
      # typescript-eslint and expressive-code-twoslash depend on.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # NuGet updates are limited to third-party dependencies and selected test
  # and tool packages. Other Microsoft-owned packages use dependency flow or
  # require manual testing.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "Microsoft.AspNetCore.TestHost"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "OpenTelemetry.*"
      - dependency-name: "System.CommandLine"
      - dependency-name: "xunit"
      - dependency-name: "xunit.*"
    groups:
      nuget-selected:
        patterns:
          - "Microsoft.AspNetCore.TestHost"
          - "Microsoft.CodeAnalysis.CSharp.Workspaces"
          - "Microsoft.NET.Test.Sdk"
          - "OpenTelemetry.*"
          - "System.CommandLine"
          - "xunit"
          - "xunit.*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
