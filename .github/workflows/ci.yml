name: CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main, release/* ]

# Concurrency strategy:
# - On pull_request: group by PR number. New commits to the PR cancel the
#   in-flight run for the same PR.
# - On push (main/release/*): include `github.run_id` so every push gets a
#   unique group. This guarantees pushes never cancel each other, even if
#   several commits land while an earlier run is still in progress.
#   (With a shared group, GHA cancels older *pending* runs even when
#   `cancel-in-progress: false`, which would silently drop required CI on
#   `main`.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      apphost: ${{ steps.filter.outputs.apphost }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clone; the two PR SHAs we need to diff against are
          # fetched explicitly below. This is much cheaper than `fetch-depth: 0`.
          fetch-depth: 1

      - name: Fetch PR base and head for diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git fetch --depth=1 origin "$HEAD_SHA"

      - id: filter
        name: Detect changed areas
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "apphost=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # If the workflow changed, build everything. if it hasn't,
          # check for frontend and/or apphost changes...
          if git diff --quiet "$base_sha" "$head_sha" -- .github/workflows; then
            workflow=false
          else
            workflow=true
          fi

          if [[ "$workflow" == "true" ]]; then
            frontend=true
            apphost=true
          else
            if git diff --quiet "$base_sha" "$head_sha" -- src/frontend src/site; then
              frontend=false
            else
              frontend=true
            fi

            if git diff --quiet "$base_sha" "$head_sha" -- src/apphost src/statichost tests/Aspire.Dev.AppHost.Tests tests/StaticHost.Tests Aspire.Dev.slnx global.json NuGet.config; then
              apphost=false
            else
              apphost=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "apphost=$apphost" >> "$GITHUB_OUTPUT"

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-build.yml
    with:
      node_version: '24.x'
      pull_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
      profile_build: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-profile') }}
      # Experiment: the other variants run as frontend-build-<variant> below
      # (same cache_round on a new commit: a prefix hit, the usual PR case).
      site_source: artifact
      variant: artifact
      cache_round: r2
    secrets:
      ASPIRE_BOT_APP_ID: ${{ secrets.ASPIRE_BOT_APP_ID }}
      ASPIRE_BOT_PRIVATE_KEY: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}

  frontend-build-tar:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-build.yml
    with:
      node_version: '24.x'
      site_source: tar
      variant: tar
      cache_round: r2
      run_validation: false

  frontend-build-shard-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-build.yml
    with:
      node_version: '24.x'
      site_source: shard-build
      variant: shard-build
      cache_round: r2
      run_validation: false

  frontend-build-hybrid:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-build.yml
    with:
      node_version: '24.x'
      site_source: hybrid
      variant: hybrid
      cache_round: r2
      run_validation: false

  apphost-build:
    needs: changes
    if: ${{ needs.changes.outputs.apphost == 'true' }}
    uses: ./.github/workflows/apphost-build.yml

  release-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release merge policy and ancestry
        shell: bash
        run: |
          bash -n .github/scripts/merge-main-into-release.sh
          bash -n .github/scripts/repair-release-sync-ancestry.sh
          bash -n .github/scripts/test-merge-main-into-release.sh
          bash .github/scripts/test-merge-main-into-release.sh

  ci-gate:
    needs: [changes, frontend-build, frontend-build-tar, frontend-build-shard-build, frontend-build-hybrid, apphost-build, release-sync-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          APPHOST_CHANGED: ${{ needs.changes.outputs.apphost }}
          FRONTEND_RESULT: ${{ needs['frontend-build'].result }}
          APPHOST_RESULT: ${{ needs['apphost-build'].result }}
          TAR_RESULT: ${{ needs['frontend-build-tar'].result }}
          SHARD_RESULT: ${{ needs['frontend-build-shard-build'].result }}
          HYBRID_RESULT: ${{ needs['frontend-build-hybrid'].result }}
          RELEASE_SYNC_RESULT: ${{ needs['release-sync-tests'].result }}
        run: |
          echo "changes result: $CHANGES_RESULT"
          echo "frontend changed: $FRONTEND_CHANGED"
          echo "frontend-build result: $FRONTEND_RESULT"
          echo "apphost changed: $APPHOST_CHANGED"
          echo "apphost-build result: $APPHOST_RESULT"
          echo "release-sync-tests result: $RELEASE_SYNC_RESULT"

          for variant in "$TAR_RESULT" "$SHARD_RESULT" "$HYBRID_RESULT"; do
            if [[ "$FRONTEND_CHANGED" == "true" && "$variant" != "success" ]]; then
              echo "Every frontend experiment variant must succeed."
              exit 1
            fi
          done

          if [[ "$RELEASE_SYNC_RESULT" != "success" ]]; then
            echo "The release sync tests must succeed."
            exit 1
          fi

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "The changes job must succeed."
            exit 1
          fi

          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            if [[ "$FRONTEND_RESULT" != "success" ]]; then
              echo "frontend-build should have run and succeeded."
              exit 1
            fi
          elif [[ "$FRONTEND_RESULT" != "skipped" ]]; then
            echo "frontend-build should have been skipped."
            exit 1
          fi

          if [[ "$APPHOST_CHANGED" == "true" ]]; then
            if [[ "$APPHOST_RESULT" != "success" ]]; then
              echo "apphost-build should have run and succeeded."
              exit 1
            fi
          elif [[ "$APPHOST_RESULT" != "skipped" ]]; then
            echo "apphost-build should have been skipped."
            exit 1
          fi
