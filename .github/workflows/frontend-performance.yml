name: Frontend performance comparison

on:
  pull_request:
    branches: [main, release/*]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: frontend-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build-profile') }}
    name: Profile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.variant == 'baseline' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Both checkouts start without an Astro content cache.
      - name: Profile production build
        env:
          MODE: production
          ASTRO_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=8192
          ASPIRE_BUILD_CONCURRENCY: "4"
          BUILD_TIMING: "1"
          BUILD_TIMING_OUT: ${{ runner.temp }}/frontend-performance/timing.jsonl
          BUILD_TIMING_LABEL: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend-performance"
          git rev-parse HEAD > "$RUNNER_TEMP/frontend-performance/commit.txt"
          pnpm git-env
          pnpm compute-skill-digests
          /usr/bin/time -v node --cpu-prof \
            --cpu-prof-dir="$RUNNER_TEMP/frontend-performance" \
            ./node_modules/astro/bin/astro.mjs build --mode production \
            2>&1 | tee "$RUNNER_TEMP/frontend-performance/build.log"

      - name: Measure output
        env:
          BUILD_METRICS_DIR: ${{ runner.temp }}/frontend-performance
          ASTRO_CACHE_HIT: "false"
          PROFILE_BUILD: "true"
        run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/measure-build-output.mjs

      - name: Upload comparison diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-performance-${{ matrix.variant }}
          path: ${{ runner.temp }}/frontend-performance
          if-no-files-found: error
          retention-days: 7
