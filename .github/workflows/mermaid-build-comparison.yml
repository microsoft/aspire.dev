name: Mermaid build comparison

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/mermaid-build-comparison.yml
      - src/frontend/**

permissions: {}

concurrency:
  group: mermaid-build-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build-profile') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: 8-core-ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=8192
      BUILD_TIMING: 1
    steps:
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include the exact base content in both variants, even if the PR is behind main.
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: candidate/src/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install both checkouts before timing
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (cd "$variant/src/frontend" && bun install --frozen-lockfile)
          done

      - name: Compare cold production builds on the same runner
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            (
              cd "$variant/src/frontend"
              export BUILD_METRICS_DIR="$RUNNER_TEMP/mermaid-build-comparison/$variant"
              export BUILD_TIMING_OUT="$BUILD_METRICS_DIR/timing.jsonl"
              export BUILD_TIMING_LABEL="$variant"
              export GITHUB_SHA="$(git rev-parse HEAD)"
              mkdir -p "$BUILD_METRICS_DIR"
              # No Astro cache is restored; install time is excluded for both builds.
              /usr/bin/time -v -o "$BUILD_METRICS_DIR/resources.txt" \
                bun run build:production 2>&1 | tee "$BUILD_METRICS_DIR/build.log"
              node scripts/measure-build-output.mjs
            )
          done

      - name: Summarize baseline and candidate
        working-directory: candidate/src/frontend
        env:
          COMPARISON_DIR: ${{ runner.temp }}/mermaid-build-comparison
        run: node scripts/summarize-mermaid-build-comparison.mjs

      - name: Upload measurements and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-build-comparison
          path: ${{ runner.temp }}/mermaid-build-comparison
          if-no-files-found: warn
          retention-days: 7
