name: OG preview tests

on:
  pull_request:
    paths:
      - ".github/extensions/og-preview/**"
      - ".github/workflows/og-preview-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/extensions/og-preview/**"
      - ".github/workflows/og-preview-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
      - run: node --test .github/extensions/og-preview/tests/*.test.mjs
