name: AppHost Build

on:
  workflow_call:
    inputs:
      profile_publish:
        description: Publish the complete site and capture static-asset and container diagnostics
        required: false
        default: false
        type: boolean
      profile_compression:
        description: Compare compression, image sizes, and browser performance on identical generated content
        required: false
        default: false
        type: boolean
      profile_browser:
        description: Rerun browser/cache profiling from the latest successful paired corpus
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: AppHost Build
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TEST_RESULTS_DIR: ${{ github.workspace }}/testresults
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore tests/Aspire.Dev.AppHost.Tests/Aspire.Dev.AppHost.Tests.csproj
          dotnet restore tests/StaticHost.Tests/StaticHost.Tests.csproj

      - name: Build
        id: build
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          dotnet build tests/Aspire.Dev.AppHost.Tests/Aspire.Dev.AppHost.Tests.csproj --no-restore --configuration Release -bl:"$TEST_RESULTS_DIR/Aspire.Dev.AppHost.Tests.build.binlog"
          dotnet build tests/StaticHost.Tests/StaticHost.Tests.csproj --no-restore --configuration Release -bl:"$TEST_RESULTS_DIR/StaticHost.Tests.build.binlog"

      - name: Verify output
        run: |
          APPHOST_DLL=$(ls -1 src/apphost/Aspire.Dev.AppHost/bin/Release/*/Aspire.Dev.AppHost.dll 2>/dev/null | head -n 1)
          if [ -z "$APPHOST_DLL" ]; then
            echo "AppHost build failed - output assembly not found"
            ls -R src/apphost/Aspire.Dev.AppHost/bin/Release || true
            exit 1
          fi
          echo "Found $APPHOST_DLL"

      - name: Run AppHost tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          dotnet test tests/Aspire.Dev.AppHost.Tests/Aspire.Dev.AppHost.Tests.csproj
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal
          --results-directory "$TEST_RESULTS_DIR"
          --logger "trx;LogFileName=Aspire.Dev.AppHost.Tests.trx"
          -bl:"$TEST_RESULTS_DIR/Aspire.Dev.AppHost.Tests.binlog"

      - name: Run StaticHost unit and HTTP tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          dotnet test tests/StaticHost.Tests/StaticHost.Tests.csproj
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal
          --filter "Category!=RedisIntegration"
          --results-directory "$TEST_RESULTS_DIR"
          --logger "trx;LogFileName=StaticHost.Tests.trx"
          -bl:"$TEST_RESULTS_DIR/StaticHost.Tests.binlog"

      - name: Run StaticHost Redis integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          dotnet test tests/StaticHost.Tests/StaticHost.Tests.csproj
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal
          --filter "Category=RedisIntegration"
          --results-directory "$TEST_RESULTS_DIR"
          --logger "trx;LogFileName=StaticHost.RedisIntegration.Tests.trx"
          -bl:"$TEST_RESULTS_DIR/StaticHost.RedisIntegration.Tests.binlog"

      - name: Upload test results
        id: upload-test-results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-AppHost-ubuntu-latest
          path: |
            testresults/**/*.trx
            testresults/**/*.binlog
          retention-days: 7

      - name: Generate test results summary
        if: always()
        shell: pwsh
        run: |
          & "${{ github.workspace }}/tests/scripts/Write-TestSummary.ps1" `
            -TestResultsFolder $env:TEST_RESULTS_DIR `
            -SummaryOutputPath $env:GITHUB_STEP_SUMMARY `
            -ArtifactUrl "${{ steps.upload-test-results.outputs.artifact-url }}" `
            -SummaryTitle "AppHost and StaticHost Tests"

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apphost-release
          path: src/apphost/Aspire.Dev.AppHost/bin/Release/*/
          if-no-files-found: warn
          retention-days: 7

  browser-profile:
    name: StaticHost browser-cache profile
    if: ${{ inputs.profile_browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: Select the latest successful paired source on this branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          candidates=$(gh run list --workflow ci.yml --branch "$SOURCE_BRANCH" --status success \
            --limit 20 --json databaseId --jq '.[].databaseId')
          for id in $candidates; do
            matched=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq \
              'any(.jobs[]; .name == "apphost-build / StaticHost publish diagnostics" and any(.steps[]; .name == "Compare complete compression variants and browser performance" and .conclusion == "success"))')
            if [[ "$matched" == true ]]; then
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              echo "Reusing paired corpus from run $id."
              exit 0
            fi
          done
          echo "No completed paired compression profile was found on this branch." >&2
          exit 1
      - name: Download paired measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: statichost-publish-performance
          path: ${{ runner.temp }}/statichost-browser/source
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the same generated frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/statichost-browser/frontend
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install browser profiler dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile --prefer-offline && pnpm exec playwright install --with-deps chromium
      - name: Build representative browser profiler
        run: >
          dotnet build tests/performance/CompressionProfile/CompressionProfile.csproj
          --configuration Release --output "$RUNNER_TEMP/statichost-browser/profiler"
      - name: Measure genuine cold and warm HTTP caches
        shell: bash
        run: bash tests/scripts/profile-static-host-browser.sh
      - name: Upload browser-cache measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statichost-browser-performance
          path: |
            ${{ runner.temp }}/statichost-browser/results/**/*.json
            ${{ runner.temp }}/statichost-browser/results/**/*.log
          if-no-files-found: error
          retention-days: 7

  publish:
    name: StaticHost publish diagnostics
    if: ${{ inputs.profile_publish || inputs.profile_compression }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile_compression && 180 || 45 }}
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ASTRO_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=8192
      BUILD_TIMING: 1
      BUILD_TIMING_LABEL: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Publish complete StaticHost container archive
        env:
          BUILD_TIMING_OUT: ${{ runner.temp }}/statichost-publish/frontend-timing.jsonl
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/statichost-publish/images"
          /usr/bin/time -v -o "$RUNNER_TEMP/statichost-publish/resources.txt" \
            dotnet publish src/statichost/StaticHost/StaticHost.csproj \
              --configuration Release --runtime linux-x64 \
              /t:PublishContainer \
              -p:ContainerRepository=aspiredev \
              -p:ContainerImageTag=ci \
              -p:ContainerImageFormat=OCI \
              -p:ContainerArchiveOutputPath="$RUNNER_TEMP/statichost-publish/images" \
              "-bl:$RUNNER_TEMP/statichost-publish/publish.binlog;ProjectImports=None" \
              2>&1 | tee "$RUNNER_TEMP/statichost-publish/publish.log"

      - name: Verify published files and summarize timings
        shell: pwsh
        run: |
          & ./tests/scripts/Measure-StaticHostPublish.ps1 `
            -PublishDirectory ./src/statichost/StaticHost/bin/Release/net10.0/linux-x64/publish `
            -FrontendDirectory ./src/frontend/dist `
            -DiagnosticsDirectory "$env:RUNNER_TEMP/statichost-publish" `
            -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Build controlled compression profiler
        if: ${{ inputs.profile_compression }}
        run: >
          dotnet build tests/performance/CompressionProfile/CompressionProfile.csproj
          --configuration Release --output "$RUNNER_TEMP/statichost-publish/profiler"

      - name: Install Chromium for compression comparison
        if: ${{ inputs.profile_compression }}
        working-directory: src/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare complete compression variants and browser performance
        if: ${{ inputs.profile_compression }}
        shell: bash
        run: bash tests/scripts/profile-static-host-compression.sh

      - name: Upload publish diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statichost-publish-performance
          path: |
            ${{ runner.temp }}/statichost-publish/*.json
            ${{ runner.temp }}/statichost-publish/*.jsonl
            ${{ runner.temp }}/statichost-publish/*.binlog
            ${{ runner.temp }}/statichost-publish/*.log
            ${{ runner.temp }}/statichost-publish/*.txt
            ${{ runner.temp }}/statichost-publish/comparison/**/*.json
            ${{ runner.temp }}/statichost-publish/comparison/**/*.binlog
            ${{ runner.temp }}/statichost-publish/comparison/**/*.log
            ${{ runner.temp }}/statichost-publish/comparison/**/*.txt
            ${{ runner.temp }}/statichost-publish/comparison/*.sha256
          if-no-files-found: error
          retention-days: 7
