name: Update Release Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-release-branch
  cancel-in-progress: false

jobs:
  update-release-branch:
    name: Merge main into active release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-contents: write

      - name: Find active release branch
        id: find-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          # Fetch all branches matching release/{major}.{minor} and pick the
          # latest by version sort.
          if ! branches=$(gh api "repos/${{ github.repository }}/branches" \
            --paginate \
            --jq '.[].name'); then
            echo "::error::Failed to query repository branches via gh api."
            exit 1
          fi

          branch=$(printf '%s\n' "$branches" \
            | grep -E '^release/[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          if [[ -z "$branch" ]]; then
            echo "No active release branch found. Nothing to do."
            echo "branch=" >> "$GITHUB_OUTPUT"
          else
            echo "Active release branch: $branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release branch
        if: ${{ steps.find-branch.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.find-branch.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        if: ${{ steps.find-branch.outputs.branch != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into release branch
        if: ${{ steps.find-branch.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.find-branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"

          # Checkout is on release; always run the helper from the pinned main
          # commit, including when release has not received the helper yet.
          git show "$MAIN_SHA:.github/scripts/merge-main-into-release.sh" > "$RUNNER_TEMP/merge-main-into-release.sh"
          bash "$RUNNER_TEMP/merge-main-into-release.sh" "$MAIN_SHA" "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
