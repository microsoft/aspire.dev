name: Frontend Build

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        required: true
        default: "24.x"
        type: string
      pull_number:
        description: Pull request number when available
        required: false
        default: ""
        type: string
      profile_build:
        description: Capture opt-in CPU, timing, and output diagnostics
        required: false
        default: false
        type: boolean
    secrets:
      ASPIRE_BOT_APP_ID:
        required: false
      ASPIRE_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build
    # The heaviest job uses the larger runner. Forks cannot use that label, so
    # they fall back to the standard runner.
    runs-on: ${{ github.repository_owner == 'microsoft' && '8-core-ubuntu-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/frontend/package.json

      # Bun installs the packages; Node runs the API data, icon sprite and
      # client bundle scripts. The Douze build itself runs no Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      # The SDK installs Douze and runs the Roslyn language server of the
      # `hover-csharp` step.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Douze
        run: |
          dotnet tool install -g douze --version 0.5.1
          douze --version

      # src/frontend still holds the API index script, esbuild and the client
      # packages (src/site/README.md).
      - name: Install deps
        working-directory: src/frontend
        run: bun install --frozen-lockfile

      - name: Generate the API data
        working-directory: src/frontend
        run: bunx tsx ../site/scripts/api/build-api-index.ts

      - name: Generate the assets
        run: |
          node scripts/icons-sprite.mjs
          node scripts/build-client.mjs
          node scripts/write-build-info.mjs

      # src/site/.douze holds the disk cache and the downloaded tools. Douze
      # decides for itself what is stale, so the key only partitions by the
      # Douze version and restore-keys always resolves to the newest entry.
      # Pushes and a PR's first build save a new entry (below); later PR
      # builds keep restoring it instead of writing another entry per commit.
      - name: Restore Douze build state
        id: douze_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/site/.douze
          key: douze-build-${{ runner.os }}-0.5.1-${{ github.sha }}
          restore-keys: |
            douze-build-${{ runner.os }}-0.5.1-

      - name: Install the Douze tools
        run: douze tools install -s .

      - name: Build frontend
        env:
          PROFILE_BUILD: ${{ inputs.profile_build }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend-performance"
          profile=()
          if [[ "$PROFILE_BUILD" == "true" ]]; then
            profile=(--timeline "$RUNNER_TEMP/frontend-performance/timeline.html")
          fi
          /usr/bin/time -v douze -s . -o ../statichost/StaticHost/wwwroot "${profile[@]}" \
            2>&1 | tee "$RUNNER_TEMP/frontend-performance/build.log"

      - name: Save Douze build state
        if: ${{ success() && (github.event_name == 'push' || steps.douze_cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/site/.douze
          key: ${{ steps.douze_cache.outputs.cache-primary-key }}

      - name: Report Douze build
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.douze_cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.douze_cache.outputs.cache-matched-key }}
        run: |
          log="$RUNNER_TEMP/frontend-performance/build.log"
          {
            echo '### Douze build'
            echo "- Restored key: \`${CACHE_MATCHED_KEY:-none}\`"
            echo "- Exact hit: \`${CACHE_HIT:-false}\`"
            echo "- Cache size: \`$(du -sh .douze 2>/dev/null | cut -f1)\`"
            echo "- $(grep -E '^Build (succeeded|failed)' "$log" || echo 'No build summary')"
            echo "- Wall clock: \`$(grep 'Elapsed (wall clock)' "$log" | awk '{print $NF}')\`, peak memory: \`$(grep 'Maximum resident' "$log" | awk '{printf "%.1f GB", $NF/1048576}')\`"
            echo
            echo '```'
            grep -E '^. [a-z]' "$log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: ${{ always() && inputs.profile_build }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-performance
          path: ${{ runner.temp }}/frontend-performance
          if-no-files-found: warn
          retention-days: 7

      # Upload before the web root sanity-check so the artifact is always
      # available for debugging, even when the check step fails.
      # Note: `uses` actions ignore the job-level working-directory,
      # so the path is repo-root-relative.
      - name: Upload build artifact
        id: upload_build_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: src/statichost/StaticHost/wwwroot
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Check PR comment prerequisites
        id: pr_comment_prerequisites
        if: ${{ always() && inputs.pull_number != '' && steps.upload_build_artifact.outcome == 'success' }}
        env:
          ASPIRE_BOT_APP_ID: ${{ secrets.ASPIRE_BOT_APP_ID }}
          ASPIRE_BOT_PRIVATE_KEY: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
        shell: bash
        run: |
          can_comment=true

          if [ ! -f "../statichost/StaticHost/wwwroot/index.html" ]; then
            echo "::notice::Skipping frontend artifact PR comment because the web root index.html was not found."
            can_comment=false
          fi

          if [ -z "$ASPIRE_BOT_APP_ID" ] || [ -z "$ASPIRE_BOT_PRIVATE_KEY" ]; then
            echo "::notice::Skipping frontend artifact PR comment because GitHub App credentials are unavailable."
            can_comment=false
          fi

          echo "can_comment=$can_comment" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for PR comment
        id: pr_comment_app_token
        if: ${{ always() && steps.pr_comment_prerequisites.outputs.can_comment == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-issues: write
          permission-pull-requests: write

      - name: Upsert PR artifact comment
        if: ${{ always() && steps.pr_comment_app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.pr_comment_app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        shell: bash
        run: |
          set -euo pipefail

          urlencode() {
            node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$1"
          }

          marker='<!-- aspire-dev-frontend-dist-artifact -->'
          pr_url="${GITHUB_SERVER_URL}/${GH_REPO}/pull/${PULL_NUMBER}"
          vscode_url="vscode://davidpine-dev.asciinema/open?url=$(urlencode "$pr_url")"
          redirect_url="https://vscode.dev/redirect?url=$(urlencode "$vscode_url")"
          badge_message=$(urlencode "Open PR #${PULL_NUMBER} artifacts")
          badge_url="https://img.shields.io/badge/VS%20Code-${badge_message}-555?labelColor=007ACC&logo=visualstudiocode&logoColor=white"
          badge="[![VS Code: Open PR #${PULL_NUMBER} artifacts](${badge_url})](${redirect_url})"

          body_file=$(mktemp)
          comment_ids_file=$(mktemp)
          trap 'rm -f "$body_file" "$comment_ids_file"' EXIT

          cat > "$body_file" <<EOF
          ${marker}
          ## Frontend HTML artifact ready

          The latest frontend build uploaded the \`frontend-dist\` artifact for PR #${PULL_NUMBER}. Use the VS Code button below to open this PR with GitHub Artifacts Explorer and browse the built HTML locally.

          ${badge}

          _This comment updates automatically when a new frontend build artifact is uploaded._
          EOF

          body=$(cat "$body_file")
          gh api "repos/${GH_REPO}/issues/${PULL_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
            > "$comment_ids_file"
          comment_id=$(sed -n '1p' "$comment_ids_file")

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" \
              --raw-field body="$body" \
              >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/issues/${PULL_NUMBER}/comments" \
              --raw-field body="$body" \
              >/dev/null
          fi

      - name: Check dist
        run: |
          wwwroot=../statichost/StaticHost/wwwroot
          if [ ! -f "$wwwroot/index.html" ]; then
            echo "Frontend build incomplete - index.html not found"
            exit 1
          fi

          ls -la "$wwwroot"

  validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install deps
        run: bun install --frozen-lockfile

      # The tests of the site's own scripts (the MDX converter).
      - name: Run unit tests
        run: bunx tsx --test ../site/tests/unit/*.test.ts

  e2e:
    name: E2E (${{ matrix.project }}, shard ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    strategy:
      # One viewport failure shouldn't cancel the others - we want every
      # shard's report so we can see the whole picture in the merged HTML.
      fail-fast: false
      matrix:
        shard: [1, 2]
        project:
          - desktop-chromium
          - tablet-chromium
          - mobile-chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      # StaticHost serves the web root as production does
      # (playwright.douze.config.mjs starts it).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: src/statichost/StaticHost/wwwroot

      - name: Install Playwright Chromium
        run: bun run playwright install --with-deps chromium

      # Reporters (blob, github, junit, list) are configured in
      # `playwright.config.mjs` so they apply to every shard. Avoid passing
      # `--reporter=` here: that would override the config and silently drop
      # GitHub workflow annotations and the JUnit XML artifact.
      - name: Run Playwright (${{ matrix.project }})
        run: bun run playwright test --config playwright.douze.config.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      # Each shard publishes its blob report under a unique name so the
      # merge job below can stitch them back together into a single HTML
      # report identical to the unsharded output.
      - name: Upload Playwright blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: src/frontend/blob-report
          if-no-files-found: warn
          retention-days: 7
          # Blob reports contain pre-compressed PNG/webm/trace assets; the
          # default gzip layer just burns CPU for no size reduction.
          compression-level: 0

      - name: Upload Playwright raw results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: src/frontend/test-results
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  report:
    name: Merge Playwright reports
    # Run even when one or more e2e shards failed, so reviewers always
    # get a merged HTML report with the failure context.
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Each shard uploads under `frontend-blob-report-<project>-<shard>`;
          # the pattern collects all of them into one tree under
          # `all-blob-reports/`.
          path: src/frontend/all-blob-reports
          pattern: frontend-blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: |
          bun run playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright-report
          path: src/frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Summarize frontend quality gates
        if: ${{ always() }}
        run: |
          {
            echo '## Frontend quality reports'
            echo ''
            echo '- Unit validation (the tests of the site scripts) runs in a separate checkout alongside the build.'
            echo '- Browser coverage: two shards each for desktop, tablet, and mobile Chromium, starting as soon as the build is ready.'
            echo '- Accessibility gate: WCAG 2.0 A/AA audit, including color-contrast.'
            echo '- Responsive gate: viewport-specific UI behavior is asserted in Playwright.'
            echo '- GitHub diagnostics: Playwright github reporter emits workflow annotations.'
            echo '- Artifacts: merged HTML report, JUnit XML, screenshots, traces, videos, and raw test outputs.'
            echo ''
            echo 'Artifacts:'
            echo '- `frontend-playwright-report` (merged across all viewports)'
            echo '- `frontend-test-results-<project>-<shard>` (per shard)'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-gate:
    name: Frontend gate
    if: ${{ always() }}
    needs: [build, validation, e2e, report]
    runs-on: ubuntu-latest
    steps:
      - name: Require all frontend checks
        env:
          BUILD: ${{ needs.build.result }}
          VALIDATION: ${{ needs.validation.result }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          for result in "$BUILD" "$VALIDATION" "$E2E" "$REPORT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Every frontend job must succeed (build=$BUILD validation=$VALIDATION e2e=$E2E report=$REPORT)."
              exit 1
            fi
          done
