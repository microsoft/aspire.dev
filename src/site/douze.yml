# The Douze workflow of aspire.dev (docs/douze-migration-plan.md, section 3.2).
#
# Build: from src/site, after `node scripts/icons-sprite.mjs && node scripts/build-client.mjs` (the icon sprite and the
# client bundle; they write into assets/), run
#   douze -s src/site -o src/statichost/StaticHost/wwwroot
# The build itself runs no Node: code blocks are highlighted by Douze's `highlight` step, the hovers of TypeScript
# fences come from its `hover-typescript` step (TypeScript 7), the search index from Pagefind's native binary and the
# stylesheet from Lightning CSS's, tools Douze downloads on first use (`douze doctor -s src/site` checks them,
# `douze tools install` gets them). The Node worker of Expressive Code (scripts/code-worker.mjs, `pnpm install` in
# src/site) stays as an opt-out (the `code` step).

site:
  content: content
  data: data
  includes: templates
  shortcodes: templates/shortcodes
  url: https://aspire.dev
  locales:
    default: en
    fallback: true                 # every untranslated page exists under every locale, as today
    languages:
      de:
        label: Deutsch
        lang: de
      es:
        label: Español
        lang: es
      ja:
        label: 日本語
        lang: ja
      fr:
        label: Français
        lang: fr
      it:
        label: Italiano
        lang: it
      id:
        label: Bahasa Indonesia
        lang: id
      zh-cn:
        label: 简体中文
        lang: zh-CN
      pt-br:
        label: Português do Brasil
        lang: pt-BR
      ko:
        label: 한국어
        lang: ko
      tr:
        label: Türkçe
        lang: tr
      ru:
        label: Русский
        lang: ru
      hi:
        label: हिन्दी
        lang: hi
      da:
        label: Dansk
        lang: da
      uk:
        label: Українська
        lang: uk

markdown:
  extensions: [pipetables, tasklists, attributes, autolinks, alerts, customcontainers, smartypants, strikethrough]
  aside:
    class: starlight-aside
    kinds: [note, tip, caution, danger, important]
    titles:
      note: Note
      tip: Tip
      caution: Caution
      danger: Danger
      important: Important
  code:
    passthrough: [mermaid]
  images:
    formats: [webp]
    quality: 82
    output: assets/images

steps:
  # Data. data/api/pkgs/Aspire.Hosting.13.6.0.json is api.pkgs["Aspire.Hosting.13.6.0"], data/api/routes/csharp-types.json
  # is api.routes["csharp-types"] (data/api is generated by scripts/api/build-api-index.ts). The two landing sidebar files
  # are left out: their names collide with the folders data/api/sidebar/{csharp,typescript}/ (templates/api/sidebar.liquid
  # composes them from the per-package files).
  site-data:
    inputs: ["data/**/*.{yml,json}", "!data/api/sidebar/csharp.json", "!data/api/sidebar/typescript.json"]
    uses: data
    with:
      scope: site
  folder-data:
    inputs: ["content/**/*.{yml,json}", "!content/icons/**", "!content/reference/api/**"]
    uses: data
    with:
      scope: folder
      root: content

  # Static assets, written as they are (fingerprinting comes with the assets step): the client bundle, the CSS sources,
  # the icon sprite, the fonts, the images referenced by the chrome, and the API client scripts at their source path.
  # .well-known/ is the Astro `public` folder's agent skills, served at the root as they are (SKILL.md is not a page).
  assets:
    inputs: ["assets/**", "!assets/css/site.css", "!assets/css/site.css.map", "scripts/client/api/*.js", ".well-known/**"]
    uses: write
  # The stylesheet, assets/css/site-entry.css with its imports inlined, minified and lowered for the browsers the Astro
  # build targeted (Vite's defaults), by the Lightning CSS command line, which Douze downloads (`tool: lightningcss`).
  # scripts/build-css.mjs does the same with the Node binding (and a source map).
  stylesheet:
    inputs: ["assets/css/**/*.css", "!assets/css/site.css"]
    tool: lightningcss
    mode: batch
    run: '{{ tool }} --bundle --minify --targets "chrome >= 107, edge >= 107, firefox >= 104, safari >= 16" {{ inputs }}/assets/css/site-entry.css -o {{ outputs }}/assets/css/site.css'

  # Articles. Paths after permalink are urls (content/ is stripped); the locale folders ja/, de/... are the first segment.
  # The file icons of the code blocks' titles (templates/code/icon.liquid): the Material Icon Theme data, as
  # `material-icons` and `language-map`.
  code-icons:
    inputs: [".starlight-icons/*.json"]
    uses: data
    with:
      scope: site
      root: .starlight-icons
  pages:
    inputs: ["content/**", "!content/**/*.{yml,json}", "!content/reference/api/**", "!content/icons/**", "!content/exports/**"]
    needs: [site-data, folder-data, code-icons]
    uses: frontmatter
  permalink:
    needs: pages
    uses: permalink
    with:
      root: content
  # Not only Markdown pages: the root page is HTML.
  collections:
    needs: permalink
    uses: collect
    match: ["**/*.md", "index.html"]
  # The Dev Hub catalog reads code fence languages from it.
  doc-text:
    needs: permalink
    uses: collect
    match: ["**/*.md"]
    with:
      name: doc_text
      content: true
  localize:
    needs: [permalink, collections, doc-text]
    uses: localize
  # The root 404 page to /404.html (content/404.html).
  not-found:
    needs: localize
    uses: permalink
    match: ["404/index.html"]
  og:
    needs: not-found
    uses: social-image
    match: ["**/*.md", "!hub/**", "!reference/cli/includes/**"]
    with:
      template: og/card.svg.liquid
      width: 1200
      height: 630
      output: "og{{ locale_url | append: 'x' | replace: '/x', '' }}.png"
      skip: "og == false or ogImage or locale != 'en' or title == nil"
      text:
        - value: "{{ seoTitle | default: title }}"
          font: Outfit Bold 54
          fontfile: assets/fonts/Outfit-Bold.ttf
          x: 96
          y: 232
          width: 1008
          height: 150
          color: "#ffffff"
          align: left
        - value: "{{ description | strip_markdown | truncate: 180 }}"
          font: Outfit 30
          fontfile: assets/fonts/Outfit-Regular.ttf
          x: 96
          y: 392
          width: 1008
          height: 96
          color: "#dcd5f6"
          align: left
  paginate:
    needs: og
    uses: paginate
  # The samples' social images (/og/reference/samples/<slug>.png, the og:image of sample.html): the primary thumbnail,
  # or the branded card for the samples without one.
  # It uses the same font file as 'og': with earlier Douze builds, which copied that font for both steps to the same
  # temporary file, the build fails on Windows ("a file with a user-mapped section open"); update Douze. To leave the
  # step out somewhere, 'enabled' takes an expression over os, arch, env and watch, e.g. enabled: "os != 'windows'".
  sample-og:
    needs: paginate
    uses: social-image
    match: ["reference/samples/*/index.html"]
    with:
      template: og/sample.svg.liquid
      width: 1200
      height: 630
      output: "og/reference/samples/{{ sample.name | slug }}.png"
      text:
        - value: "{% unless sample.thumbnail %}{{ sample.title }}{% endunless %}"
          font: Outfit Bold 54
          fontfile: assets/fonts/Outfit-Bold.ttf
          x: 96
          y: 232
          width: 1008
          height: 150
          color: "#ffffff"
          align: left
        - value: "{% unless sample.thumbnail %}{{ sample.description | strip_markdown | strip | newline_to_br | split: '<br />' | first | strip | truncate: 180 }}{% endunless %}"
          font: Outfit 30
          fontfile: assets/fonts/Outfit-Regular.ttf
          x: 96
          y: 392
          width: 1008
          height: 96
          color: "#dcd5f6"
          align: left
  # The pages, the hub and samples templates, the *.liquid output templates.
  render:
    needs: sample-og
    uses: liquid
  versions:
    needs: render
    uses: replace
    with:
      tokens:
        "%ASPIRE_VERSION%": "{{ site.versions.aspire }}"
        "%ASPIRE_VERSION_MAJOR_MINOR%": "{{ site.versions.majorMinor }}"
        "%ASPIRE_VERSION_PREVIEW%": "{{ site.versions.preview }}"
  # Markdown twins at StaticHost's paths: /get-started/x/ -> /get-started/x.md, / -> /index.md, /ja/ -> /ja.md.
  # Twins of the root locale's pages, of the translated ja pages and of every locale's home page, as before (no twins of
  # the fallback copies). The Dev Hub and the samples write their own twins (`hub-md.html`, `sample-md.html`); the
  # glossary terms get theirs below.
  twins:
    needs: versions
    uses: fork
    match:
      - "**/*.md"
      - "!hub/**"
      - "!hub.md"
      - "!reference/samples/**"
      - "reference/samples/index.md"
      - "!da/**"
      - "!de/**"
      - "!es/**"
      - "!fr/**"
      - "!hi/**"
      - "!id/**"
      - "!it/**"
      - "!ko/**"
      - "!pt-br/**"
      - "!ru/**"
      - "!tr/**"
      - "!uk/**"
      - "!zh-cn/**"
      - "{da,de,es,fr,hi,id,it,ko,pt-br,ru,tr,uk,zh-cn}/index.md"
    with:
      skip: fallback
      permalink: "{% if url == '/index.html' %}/index.md{% else %}{{ url | replace: '/index.html', '.md' }}{% endif %}"
      data:
        markdown: false
        layout: false
        twin: true
      content: "# {{ title }}\n\n{{ content }}"
  glossary-twins:
    needs: twins
    uses: fork
    match: ["hub/glossary/*/index.md"]
    with:
      permalink: "{{ url | replace: '/index.html', '.md' }}"
      data:
        markdown: false
        layout: false
        twin: true
      content: "{% include 'partials/hub/glossary-term-md' %}"
  # The home twin is a Markdown rendering of the landing sections; the 404 twin is Astro's, with the component's name.
  home-twin:
    needs: glossary-twins
    uses: fork
    match: ["index.html"]
    with:
      permalink: /index.md
      data:
        markdown: false
        layout: false
        twin: true
      content: "{% include 'partials/home/home-md' %}"
  not-found-twin:
    needs: home-twin
    uses: fork
    match: ["404.html"]
    with:
      permalink: /404.md
      data:
        markdown: false
        layout: false
        twin: true
      content: "# {{ title }}\n\n<NotFoundPage />"
  markdown:
    needs: not-found-twin
    uses: markdown
  # The home pages have no heading anchors (their sections are components); component headings are not the page's.
  headings:
    needs: markdown
    uses: headings
    match: ["**/*.html", "!index.html", "!{da,de,es,fr,hi,id,it,ja,ko,pt-br,ru,tr,uk,zh-cn}/index.html"]
    with:
      anchors: true
      wrapper-class: sl-heading-wrapper
      anchor-class: sl-anchor-link
      anchor-label: "Section titled “{text}”"
      anchor-html: '<span class="sl-anchor-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="m12.11 15.39-3.88 3.88a2.52 2.52 0 0 1-3.5 0 2.47 2.47 0 0 1 0-3.5l3.88-3.88a1 1 0 1 0-1.42-1.42l-3.88 3.89a4.48 4.48 0 0 0 6.33 6.33l3.89-3.88a1 1 0 0 0-1.42-1.42m8.58-12.08a4.49 4.49 0 0 0-6.33 0l-3.89 3.88a1 1 0 1 0 1.42 1.42l3.88-3.88a2.52 2.52 0 0 1 3.5 0 2.47 2.47 0 0 1 0 3.5l-3.88 3.88a1 1 0 0 0 0 1.42 1 1 0 0 0 1.42 0l3.88-3.89a4.49 4.49 0 0 0 0-6.33M8.83 15.17a1 1 0 0 0 .71.29 1 1 0 0 0 .71-.29l4.92-4.92a1 1 0 1 0-1.42-1.42l-4.92 4.92a1 1 0 0 0 0 1.42"></path></svg></span>'
      levels: [2, 3]
      skip-classes: [not-content]
  # The hovers of the ```ts twoslash fences: this step checks them with TypeScript 7 against the SDK's declaration bundle
  # (ec.config.mjs has the same compiler options) in about a second and writes data-twoslash, which the `highlight` step
  # renders. TypeScript 7 words some hovers differently from the TypeScript 6 of the Astro site
  # (docs/douze-migration-report.md, "Build time"). With the Node worker (`code`), its TWOSLASH picks who computes them:
  # node (TypeScript 6 in Node, byte-identical popups, minutes on a cold cache) or douze (this step's results).
  hover-typescript:
    needs: headings
    uses: hover-typescript
    match: "**/*.html"
    with:
      files:
        ".aspire/modules/aspire.mts": data/twoslash/aspire.d.ts
      compiler:
        moduleResolution: bundler
        module: esnext
        target: esnext
        strict: true
      handbook:
        noErrorValidation: true
      tab-width: 2
  # C# hovers, opt-in per fence: only the fences with `twoslash` in their meta (```csharp twoslash). The Roslyn language
  # server is installed on first use. The projects are those the documentation's snippets use; most fences are
  # fragments with errors (see Douze's docs/code-hover-steps.md), rendered as warnings. Requirements: dotnet on PATH.
  # Douze also has a `hover-go` step (gopls); the site has no Go hovers, so it isn't configured here. The `highlight`
  # step renders their popups, the signatures highlighted as C#; no fence opts in yet.
  hover-csharp:
    needs: hover-typescript
    uses: hover-csharp
    match: "**/*.html"
    with:
      trigger: twoslash
      errors: warn
      tab-width: 2
      projects:
        apphost:
          titles: [AppHost.cs]
          patterns: ["DistributedApplication\\.", "IDistributedApplicationBuilder"]
          context: AppHostContext
          files:
            Projects.cs: data/csharp/Projects.cs
            AppHostContext.cs: data/csharp/AppHostContext.cs
          usings: [Aspire.Hosting, Aspire.Hosting.ApplicationModel]
          packages:
            aspire.hosting.apphost: "13.6.2"
            aspire.hosting.azure: "13.6.2"
            aspire.hosting.azure.appconfiguration: "13.6.2"
            aspire.hosting.azure.appcontainers: "13.6.2"
            aspire.hosting.azure.applicationinsights: "13.6.2"
            aspire.hosting.azure.cognitiveservices: "13.6.2"
            aspire.hosting.azure.containerregistry: "13.6.2"
            aspire.hosting.azure.cosmosdb: "13.6.2"
            aspire.hosting.azure.eventhubs: "13.6.2"
            aspire.hosting.azure.keyvault: "13.6.2"
            aspire.hosting.azure.network: "13.6.2"
            aspire.hosting.azure.operationalinsights: "13.6.2"
            aspire.hosting.azure.postgresql: "13.6.2"
            aspire.hosting.azure.redis: "13.6.2"
            aspire.hosting.azure.search: "13.6.2"
            aspire.hosting.azure.servicebus: "13.6.2"
            aspire.hosting.azure.signalr: "13.6.2"
            aspire.hosting.azure.sql: "13.6.2"
            aspire.hosting.azure.storage: "13.6.2"
            aspire.hosting.azure.webpubsub: "13.6.2"
            aspire.hosting.devtunnels: "13.6.2"
            aspire.hosting.docker: "13.6.2"
            aspire.hosting.garnet: "13.6.2"
            aspire.hosting.javascript: "13.6.2"
            aspire.hosting.kafka: "13.6.2"
            aspire.hosting.milvus: "13.6.2"
            aspire.hosting.mongodb: "13.6.2"
            aspire.hosting.mysql: "13.6.2"
            aspire.hosting.nats: "13.6.2"
            aspire.hosting.openai: "13.6.2"
            aspire.hosting.oracle: "13.6.2"
            aspire.hosting.orleans: "13.6.2"
            aspire.hosting.postgresql: "13.6.2"
            aspire.hosting.python: "13.6.2"
            aspire.hosting.qdrant: "13.6.2"
            aspire.hosting.rabbitmq: "13.6.2"
            aspire.hosting.redis: "13.6.2"
            aspire.hosting.seq: "13.6.2"
            aspire.hosting.sqlserver: "13.6.2"
            aspire.hosting.valkey: "13.6.2"
            aspire.hosting.yarp: "13.6.2"
        default:
          sdk: Microsoft.NET.Sdk.Web
          context: WebContext
          files:
            WebContext.cs: data/csharp/WebContext.cs
          usings: [Microsoft.Extensions.Hosting, Microsoft.Extensions.DependencyInjection, Microsoft.Extensions.Logging]
          packages:
            aspire.azure.data.tables: "13.6.2"
            aspire.azure.messaging.eventhubs: "13.6.2"
            aspire.azure.messaging.servicebus: "13.6.2"
            aspire.azure.messaging.webpubsub: "13.6.2"
            aspire.azure.npgsql: "13.6.2"
            aspire.azure.npgsql.entityframeworkcore.postgresql: "13.6.2"
            aspire.azure.search.documents: "13.6.2"
            aspire.azure.security.keyvault: "13.6.2"
            aspire.azure.storage.blobs: "13.6.2"
            aspire.azure.storage.queues: "13.6.2"
            aspire.confluent.kafka: "13.6.2"
            aspire.microsoft.azure.cosmos: "13.6.2"
            aspire.microsoft.data.sqlclient: "13.6.2"
            aspire.microsoft.entityframeworkcore.cosmos: "13.6.2"
            aspire.microsoft.entityframeworkcore.sqlserver: "13.6.2"
            aspire.microsoft.extensions.configuration.azureappconfiguration: "13.6.2"
            aspire.mongodb.driver: "13.6.2"
            aspire.mysqlconnector: "13.6.2"
            aspire.nats.net: "13.6.2"
            aspire.npgsql: "13.6.2"
            aspire.npgsql.entityframeworkcore.postgresql: "13.6.2"
            aspire.oracle.entityframeworkcore: "13.6.2"
            aspire.pomelo.entityframeworkcore.mysql: "13.6.2"
            aspire.qdrant.client: "13.6.2"
            aspire.rabbitmq.client: "13.6.2"
            aspire.seq: "13.6.2"
            aspire.stackexchange.redis: "13.6.2"
            aspire.stackexchange.redis.distributedcaching: "13.6.2"
            aspire.stackexchange.redis.outputcaching: "13.6.2"
  # Code highlighting, by Douze's `highlight` step (enabled) or by the Node worker (`code`, Expressive Code: set
  # `enabled: true` on `code` and `enabled: false` on `highlight`). The native step renders Expressive Code's markup
  # (templates/code/*.liquid) with the TextMate grammars and themes of the worker's Shiki, and the twoslash popups of
  # the hover steps' results; it needs no Node. docs/douze-migration-report.md, "Code blocks", has the differences. The
  # worker's TWOSLASH picks who computes the TypeScript hovers: node (TypeScript 6 in Node) or douze.
  highlight:
    needs: hover-csharp
    uses: highlight
    with:
      themes: [laserwave, slack-ochin]
      tab-width: 2
      templates:
        block: code/block.liquid
        popup: code/popup.liquid
      markers:
        mark: ["#174a9099", "#9ab6ff99"]
        ins: ["#1e571599", "#8ec77d99"]
        del: ["#862d2799", "#ff9c8e99"]
  code:
    needs: highlight
    enabled: false
    run: node scripts/code-worker.mjs
    mode: worker
    match: "**/*.html"
    sources: ["scripts/code-worker.mjs", "scripts/douze-worker.mjs", "scripts/twoslash-results.mjs", "ec.config.mjs", "data/twoslash/**", "data/i18n/*.json"]
    with:
      cache: .douze/code-cache
    env:
      NODE_NO_WARNINGS: "1"
      TWOSLASH: node
    stderr: warn

  # API reference: one template per route paginates its route list (size 1); the .html templates render the pages, the
  # *-md.html templates the Markdown twins (permalink: "{{ route.md }}", layout: false, rendered without HTML encoding).
  # Not `needs: collections`: a step needing a reduce step also receives the files it passes through, and the pages
  # would reach `layout` twice. The "Learn more" links of experimental types read diagnostic_pages.urls instead: a
  # collection of the diagnostics pages alone, read from the source (nothing passes through it).
  diagnostic-pages:
    inputs: "content/diagnostics/*.md"
    uses: frontmatter
  diagnostic-urls:
    needs: diagnostic-pages
    uses: permalink
    with:
      root: content
  diagnostics:
    needs: diagnostic-urls
    uses: collect
    with:
      name: diagnostic_pages
  api-pages:
    inputs: "content/reference/api/**"
    needs: [site-data, diagnostics]
    uses: frontmatter
  api-paginate:
    needs: api-pages
    uses: paginate
  api-render:
    needs: api-paginate
    uses: liquid
    match: "**/*.html"
  api-render-md:
    needs: api-render
    uses: liquid
    match: "**/*.md"
    with:
      encode: none

  # Chrome, for the articles and for the API reference: two steps, so that the search index starts once the articles
  # are laid out, while the API pages still are.
  layout:
    needs: code
    uses: layout
    with:
      includes: templates/layouts
  api-layout:
    needs: api-render-md
    uses: layout
    with:
      includes: templates/layouts
  # Pagefind over the pages it indexes (those with data-pagefind-body: the root locale's articles, the hub, the
  # reference pages but the API's, which have none): its native binary (the extended build, which Douze downloads:
  # `tool: pagefind`, the version of package.json) over the laid out pages written to a temporary folder, its index
  # read back as files for `write`. A batch step is one unit: replayed from the cache while no page changed, and run
  # concurrently with the API layout and the write. Its index has its own write step (`search-write`): `write` needing
  # it would wait for it; the pages that `search` does not match pass through it to `search-write`, which leaves them
  # (`write` has them from `layout`).
  search:
    needs: layout
    tool: pagefind
    run: "{{ tool }} --site {{ inputs }} --output-path {{ outputs }}/pagefind"
    mode: batch
    match: ["**/*.html", "!reference/api/**", "!{da,de,es,fr,hi,id,it,ja,ko,pt-br,ru,tr,uk,zh-cn}/**"]
    timeout: 20m
    stderr: warn
  # Static files of the content folder that the pages step leaves out (JSON is data there): the Mermaid icon pack
  # (scripts/client/from-frontend/config/icon-packs.mjs loads /icons/aspire.json).
  static:
    inputs: ["content/icons/**"]
    uses: permalink
    with:
      root: content
  # The code of the chrome (the install CLI modal's commands, partials/code-plain.liquid): fences that the layouts write,
  # highlighted as `highlight` does; the fences of the content are highlighted already and left alone. Every page has
  # the same few commands, whose tokens come from the cache. One step per branch: a step reads the scopes, so it waits
  # for every reduce step upstream of it, and one step after both layouts would hold the API pages until the articles'
  # reduce steps (hover-typescript, collections) are done: about 15 GB of peak memory instead of 7.
  highlight-chrome:
    needs: layout
    uses: highlight
    match: "**/*.html"
    with:
      themes: [laserwave, slack-ochin]
      tab-width: 2
      templates:
        block: code/block.liquid
        popup: code/popup.liquid
  highlight-api-chrome:
    needs: api-layout
    uses: highlight
    match: "**/*.html"
    with:
      themes: [laserwave, slack-ochin]
      tab-width: 2
      templates:
        block: code/block.liquid
        popup: code/popup.liquid
  write:
    needs: [highlight-chrome, highlight-api-chrome, assets, stylesheet, static]
    uses: write
  search-write:
    needs: search
    uses: write
    match: "pagefind/**"
