# Site-wide values (`site.*` in templates; douze.yml's `site:` settings such as site.url complete this object).
# Converted from src/frontend: astro.config.mjs (Starlight options), config/socials.config.ts,
# config/aspire-versions.mjs, config/locales.ts and config/sidebar/sidebar.topics.ts.

title: Aspire
# aspireProject.description (src/frontend/src/data/aspire-project.ts)
description: Aspire is the tool for code-first, extensible, observable dev and deploy.

# Starlight `logo: { src: ./src/assets/aspire-logo-32.svg, replacesTitle: false }`: one logo for both themes.
# The svgs are copies of src/frontend/src/assets/aspire-logo-{32,256}.svg in assets/images/logo/.
logo:
  light: /assets/images/logo/aspire-logo-32.svg
  dark: /assets/images/logo/aspire-logo-32.svg
  large: /assets/images/logo/aspire-logo-256.svg
  alt: ""
  replacesTitle: false

# Header social links, in order (socials.config.ts). `icon` is a Starlight icon name.
social:
  - { icon: github, label: GitHub, href: "https://github.com/microsoft/aspire" }
  - { icon: discord, label: Discord, href: "https://discord.com/invite/raNPcaaSj8" }
  - { icon: x.com, label: X, href: "https://x.com/aspiredotdev" }
  - { icon: blueSky, label: BlueSky, href: "https://bsky.app/profile/aspire.dev" }
  - { icon: youtube, label: YouTube, href: "https://www.youtube.com/@aspiredotdev" }
  - { icon: twitch, label: Twitch, href: "https://www.twitch.tv/aspiredotdev" }
  - { icon: document, label: Blog, href: "https://devblogs.microsoft.com/aspire" }

repo: https://github.com/microsoft/aspire
docs_repo: https://github.com/microsoft/aspire.dev

# config/aspire-versions.mjs; the `versions` workflow step replaces %ASPIRE_VERSION%, %ASPIRE_VERSION_MAJOR_MINOR%
# and %ASPIRE_VERSION_PREVIEW% with these. Update them together with the release date.
versions:
  aspire: "13.6.0"
  majorMinor: "13.6"
  preview: 13.6.0-preview.1.26479.8
  releaseDate: "2026-09-29"

# Edit link: the page's source path relative to the content folder is appended
# (content/get-started/first-app.md -> <edit_link>get-started/first-app.md).
# Today: https://github.com/microsoft/aspire.dev/edit/main/src/frontend/ + src/content/docs/<path>.mdx
edit_link: https://github.com/microsoft/aspire.dev/edit/main/src/site/content/

# The sidebar topics in display order (sidebars.<topic> is data/sidebars/<topic>.yml).
sidebar_topics: [docs, integrations, dashboard, deployment, reference, community]

# Pages that belong to no topic and show no topic sidebar (starlight-sidebar-topics `exclude`), as url globs.
sidebar_exclude:
  - "**/includes/**"
  - /support/
  - /diagnostics/aspireats001/
  - "/*/diagnostics/aspireats001/"
  - /reference/api/
  - "/reference/api/**"

# The language select, in order (config/locales.ts). `prefix` is the url prefix of the locale ("" for the root).
languages:
  - { key: en, label: English, lang: en, dir: ltr, prefix: "" }
  - { key: de, label: Deutsch, lang: de, dir: ltr, prefix: /de }
  - { key: es, label: "Español", lang: es, dir: ltr, prefix: /es }
  - { key: ja, label: "日本語", lang: ja, dir: ltr, prefix: /ja }
  - { key: fr, label: "Français", lang: fr, dir: ltr, prefix: /fr }
  - { key: it, label: Italiano, lang: it, dir: ltr, prefix: /it }
  - { key: id, label: Bahasa Indonesia, lang: id, dir: ltr, prefix: /id }
  - { key: zh-cn, label: "简体中文", lang: zh-CN, dir: ltr, prefix: /zh-cn }
  - { key: pt-br, label: "Português do Brasil", lang: pt-BR, dir: ltr, prefix: /pt-br }
  - { key: ko, label: "한국어", lang: ko, dir: ltr, prefix: /ko }
  - { key: tr, label: "Türkçe", lang: tr, dir: ltr, prefix: /tr }
  - { key: ru, label: "Русский", lang: ru, dir: ltr, prefix: /ru }
  - { key: hi, label: "हिंदी", lang: hi, dir: ltr, prefix: /hi }
  - { key: da, label: Dansk, lang: da, dir: ltr, prefix: /da }
  - { key: uk, label: "Українська", lang: uk, dir: ltr, prefix: /uk }

# llms.txt (starlight-llms-txt options in astro.config.mjs)
llms:
  project_name: Aspire

# Options of the chrome's custom selects (CustomSelect.astro props of InstallCliModal.astro and FooterPreferences.astro).
selects:
  install_channels:
    - { value: release, label: Stable, description: Latest stable release for production use, selected: true }
    - { value: staging, label: Staging, description: Prerelease builds from the current release branch }
    - { value: dev, label: Dev, description: "Latest builds from main, frequently built and not fully tested" }
  # starlight-kbd's types (mac, windows, linux), Windows selected by default.
  kbd_types:
    - { value: mac, label: macOS, detector: apple }
    - { value: windows, label: Windows, detector: windows, selected: true }
    - { value: linux, label: Linux, detector: linux }

# Chrome switches that were environment variables of the Astro build: PUBLIC_ENVIRONMENT_BADGE (a badge next to the
# site title, 'localhost' in astro dev) and PUBLIC_ENABLE_SITE_TOUR (the site tour button and script).
environment_badge: ""
site_tour: false

# Starlight lastUpdated (off in astro.config.mjs): true shows "Last updated" from the git step's page.updated on every
# article; a page's own `lastUpdated` date front matter shows it either way.
last_updated: false
