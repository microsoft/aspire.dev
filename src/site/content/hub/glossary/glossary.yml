# Folder data of the glossary terms (src/frontend/src/pages/hub/glossary/[term].astro): every term page uses the
# glossary layout (templates/layouts/glossary.liquid, inside the hub layout) and is in collections.glossary, which the
# glossary index (index.html), the resource catalog (hub/browse/) and the Markdown twins read. The index page sets its
# own layout and tags. Previous/next (glossary order: by title) are each term's `prev`/`next` front matter: Douze has
# no computed front matter, and an inner layout cannot pass values to the hub layout's footer.
layout: glossary
localize: false   # the hub is English only, as on the Astro site: no locale copies of the terms
tags: [glossary]
