# Folder data of the resources hub (src/frontend/src/data/dev-hub.ts and utils/dev-center/topics.ts): the content of
# the hub landing page (hub/index.html) and of its Markdown twin (hub/hub-md.html), the topics and resource types of
# the catalog (hub/browse/). Featured samples name entries of data/samples.json.
dev_hub:
  title: Aspire resources
  description: Find guides, working samples, integrations, and reference docs for your next Aspire app. Browse this directory by topic, language, or cloud and deployment target.

  topics:
    - { id: foundations, title: Foundations, icon: open-book, color: "var(--sl-color-purple)", href: /docs/, description: "AppHosts, resources, and the concepts behind your app.", action: Learn the fundamentals }
    - { id: integrations, title: Integrations, icon: puzzle, color: "var(--sl-color-green)", href: /integrations/, description: "Databases, messaging, AI, and services that work together.", action: Find an integration }
    - { id: dashboard, title: Dashboard, icon: "seti:happenings", color: "var(--sl-color-blue)", href: /dashboard/, description: "See your running app through logs, traces, and metrics.", action: Explore the dashboard }
    - { id: deployment, title: Deployment, icon: rocket, color: "var(--sl-color-orange)", href: /deployment/, description: "Take your app from local development to production.", action: Choose a deployment target }
    - { id: reference, title: Reference, icon: "seti:json", color: "var(--color-cyan)", href: /reference/overview/, description: "APIs, CLI commands, container images, and diagnostics.", action: Find a reference }
    - { id: community, title: Community, icon: heart, color: "var(--color-magenta)", href: /community/, description: "Videos, contributions, and people building with Aspire.", action: Join the community }

  resources:
    - { title: Create your first app, format: Quickstart, description: Run services together and explore them in the Aspire dashboard., href: /get-started/first-app/, icon: open-book }
    - { title: Add Aspire to your project, format: How-to, description: Keep your code. Add orchestration and observability., href: /get-started/add-aspire-existing-app/, icon: puzzle }
    - { title: Deploy your app, format: Tutorial, description: "Take your locally running app to the cloud, step by step.", href: /get-started/deploy-first-app/, icon: rocket }
    - { title: Understand the concepts, format: Glossary, description: Learn the vocabulary with definitions and practical examples., href: /hub/glossary/, icon: notes }

  languages:
    - { title: "C# / .NET", description: Build your first app, href: "/get-started/first-app/?aspire-lang=csharp", icon: "devicon:csharp", color: "var(--sl-color-purple)" }
    - { title: JavaScript / TypeScript, description: Build your first app, href: "/get-started/first-app/?aspire-lang=typescript", icon: "devicon:typescript", color: "var(--sl-color-blue)" }
    - { title: Python, description: Run Python apps with Aspire, href: /integrations/frameworks/python/, icon: "devicon:python", color: "var(--sl-color-orange)" }
    - { title: Go, description: Add a Go service, href: /integrations/frameworks/go/go-get-started/, icon: "devicon:go-wordmark", color: "var(--color-cyan)" }
    - { title: Java, description: Orchestrate your Java app, href: /integrations/frameworks/java/java-get-started/, icon: "devicon:java", color: "var(--sl-color-orange)" }
    - { title: Rust, description: Get started with Rust, href: /integrations/frameworks/rust/rust-get-started/, icon: rust-theme, color: "var(--color-magenta)" }

  reference_links:
    - { title: CLI commands, description: "Create, run, deploy, and troubleshoot from your terminal.", href: /reference/cli/overview/, icon: "seti:powershell" }
    - { title: TypeScript API, description: "Explore the AppHost modules, functions, and resource types.", href: /reference/api/typescript/, icon: "seti:typescript" }
    - { title: "C# API", description: "Find packages, types, methods, and extension APIs.", href: /reference/api/csharp/, icon: "seti:c-sharp" }
    - { title: Container images, description: Find the images and tags used by Aspire integrations., href: /reference/container-images/, icon: "seti:docker" }
    - { title: Diagnostics, description: Look up a diagnostic code and how to resolve it., href: /diagnostics/overview/, icon: "seti:config" }

  # image: the icon (light, dark) under assets/images/icons.
  cloud_links:
    - { id: aws, title: AWS, description: Connect and provision AWS services., href: /integrations/cloud/aws/overview/, color: "var(--sl-color-orange)", light: /assets/images/icons/aws-light-icon.png, dark: /assets/images/icons/aws-icon.png }
    - { id: azure, title: Azure, description: "Model, provision, and connect Azure services.", href: /integrations/cloud/azure/overview/, color: "var(--sl-color-blue)", light: /assets/images/icons/azure-icon.png, dark: /assets/images/icons/azure-icon.png }
    - { id: kubernetes, title: Kubernetes, description: Publish Helm charts and deploy to your cluster., href: /deployment/kubernetes/, color: "var(--sl-color-blue)", light: /assets/images/icons/kubernetes.svg, dark: /assets/images/icons/kubernetes.svg }

  blog_highlights:
    - { title: "Aspire 13.5: Fresh pixels and better workflows", description: "Explore the refreshed dashboard, live terminals, and new deployment capabilities.", date: "2026-08-18", href: "https://devblogs.microsoft.com/aspire/whats-new-aspire-13-5/", image: "https://devblogs.microsoft.com/aspire/wp-content/uploads/sites/90/2026/08/ChatGPT-Image-Aug-18-2026-03_59_09-PM-768x432.webp" }
    - { title: "Aspire in VS Code: the 13.4 developer loop", description: "Run, debug, and inspect your app without leaving the editor.", date: "2026-06-16", href: "https://devblogs.microsoft.com/aspire/aspire-vscode-extension-13-4/", image: "https://devblogs.microsoft.com/aspire/wp-content/uploads/sites/90/2026/06/featured-image-768x365.webp" }
    - { title: "Distributed multi-agent systems with Aspire and Microsoft Agent Framework", description: "See how the AlpineAI demo connects agents, services, and observability.", date: "2026-06-09", href: "https://devblogs.microsoft.com/aspire/building-distributed-multi-agent-systems-with-aspire-and-microsoft-agent-framework/", image: "https://devblogs.microsoft.com/aspire/wp-content/uploads/sites/90/2026/06/foundry-agents-alpineai-aspire-resources-768x512.webp" }

  # The featured samples (names of data/samples.json) with their own title and description, and their screenshot
  # (light, dark) under assets/images/samples.
  featured_samples:
    - { id: aspire-shop, title: Aspire Shop, description: A Blazor storefront with a PostgreSQL catalog and Redis shopping cart., light: /assets/images/samples/aspire-shop/aspireshop-frontend-light.png, dark: /assets/images/samples/aspire-shop/aspireshop-frontend-dark.png }
    - { id: aspire-with-javascript, title: "Angular, React, and Vue", description: Four JavaScript frontends connected to one weather API., light: /assets/images/samples/aspire-with-javascript/reactvite-app-light.png, dark: /assets/images/samples/aspire-with-javascript/reactvite-app-dark.png }
    - { id: aspire-with-python, title: FastAPI + JavaScript, description: Run a Python API and JavaScript frontend together with Aspire., light: /assets/images/samples/aspire-with-python/aspire-with-python-primary-page-light.png, dark: /assets/images/samples/aspire-with-python/aspire-with-python-primary-page-dark.png }
    - { id: golang-api, title: Go REST API, description: "A Go service with in-memory storage, health checks, and an OpenAPI reference.", light: /assets/images/samples/golang-api/golang-api.png, dark: /assets/images/samples/golang-api/golang-api.png }
    - { id: volume-mount, title: Persistent Volume, description: "Keep user accounts across app restarts with Blazor, SQL Server, and persistent storage.", light: /assets/images/samples/volume-mount/volume-mount-frontend-login-light.png, dark: /assets/images/samples/volume-mount/volume-mount-frontend-login-dark.png }
    - { id: aspire-with-node, title: Node.js Weather Explorer, description: Explore live forecasts on a React map backed by an Express API and a TypeScript AppHost., light: /assets/images/samples/aspire-with-node/aspire-with-node-primary-page-light.png, dark: /assets/images/samples/aspire-with-node/aspire-with-node-primary-page-dark.png }

  dashboard_links:
    - { title: Resources and health, href: "/dashboard/explore/#resources-page" }
    - { title: Follow a distributed trace, href: "/dashboard/explore/#traces-page" }
    - { title: Console logs, href: "/dashboard/explore/#console-logs-page" }
    - { title: Structured logs, href: "/dashboard/explore/#structured-logs-page" }
    - { title: Metrics, href: "/dashboard/explore/#metrics-page" }
    - { title: AI coding agents, href: /dashboard/ai-coding-agents/ }
    - { title: Run it standalone, href: /dashboard/standalone/ }

  # Most recent uploads from https://www.youtube.com/@aspiredotdev/videos, newest first.
  videos:
    - { title: "Aspire Bytes: withReference and withEnvironment", id: 1D4PQiW3eqg, series: Aspire Bytes }
    - { title: Aspire 13.5 is here!, id: pEbo-qKif1U, series: Release highlights }

  # The resource types of the catalog (utils/dev-center/resource-types.ts), in filter order; icon: the class icon.
  resource_types:
    - { id: guide, label: Guide, icon: "i-mdi:book-open-page-variant-outline" }
    - { id: quickstart, label: Quickstart, icon: "i-mdi:rocket-launch-outline" }
    - { id: tutorial, label: Tutorial, icon: "i-mdi:book-open-page-variant-outline" }
    - { id: how-to, label: How-to, icon: "i-mdi:pencil-outline" }
    - { id: sample, label: Sample, icon: "i-mdi:laptop" }
    - { id: integration, label: Integration, icon: "i-mdi:puzzle-outline" }
    - { id: diagnostic, label: Diagnostic, icon: "i-mdi:alert-outline" }
    - { id: glossary, label: Glossary, icon: "i-mdi:notebook-outline" }
    - { id: video, label: Video, icon: "i-mdi:youtube" }
    - { id: blog, label: Blog, icon: "i-mdi:file-document-outline" }
    - { id: reference, label: Reference, icon: "i-mdi:cog-outline" }
    - { id: release-notes, label: Release notes, icon: "i-mdi:file-document-outline" }

  # The video channels of the catalog (config/socials.config.ts: the YouTube and Twitch links).
  channels:
    - { platform: youtube, title: Aspire on YouTube, href: "https://www.youtube.com/@aspiredotdev", description: Explore videos and live streams on the official Aspire YouTube channel. }
    - { platform: twitch, title: Aspire on Twitch, href: "https://www.twitch.tv/aspiredotdev", description: Watch the official Aspire Twitch channel for live streams with the team. }
