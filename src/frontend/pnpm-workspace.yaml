minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  esbuild: true
  sharp: true

allowedDeprecatedVersions:
  glob: 11.1.0
  node-domexception: 1.0.0

packageExtensions:
  # llms-txt still embeds MDX 7. Keep its optional processor peer in the
  # supported 0.3 cohort instead of borrowing MDX 8's 0.4 processor.
  '@astrojs/mdx@7.0.8':
    optionalDependencies:
      '@astrojs/markdown-satteri': 0.3.8

peerDependencyRules:
  allowedVersions:
    '@ec-ts/twoslash-vue@1.0.0>typescript': ^6.0.0
    '@ec-ts/twoslash@1.0.0>typescript': ^6.0.0
    '@ec-ts/vfs@1.0.0>typescript': ^6.0.0
    'expressive-code-twoslash@0.6.1>@expressive-code/core': ^0.44.0
    expressive-code-twoslash@0.6.1>expressive-code: ^0.44.0
    expressive-code-twoslash@0.6.1>typescript: ^6.0.0
    starlight-plugin-icons@1.1.6>typescript: ^6.0.0
    vite-plugin-virtual@0.5.0>vite: ^8.0.0

overrides:
  '@anthropic-ai/claude-code@<2.0.31': '>=2.0.31'
  '@cacheable/memory@2.2.1': 2.2.0
  '@cacheable/net@2.1.1': 2.1.0
  '@cacheable/node-cache@3.1.2': 3.1.1
  '@cacheable/utils@2.5.1': 2.5.0
  '@vitest/mocker@>=2.1.0 <4.1.11': 4.1.11
  ajv@<6.14.0: 6.14.0
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  brace-expansion@<5.0.9: '>=5.0.9'
  cache-manager@7.2.10: 7.2.9
  cacheable-request@13.0.20: 13.0.19
  cacheable@2.5.1: 2.5.0
  devalue@<5.6.4: '>=5.6.4'
  dompurify@<3.4.12: '>=3.4.12'
  ecto@5.0.1: 5.0.0
  esbuild@<0.28.1: '>=0.28.1'
  fast-xml-builder@<1.1.7: '>=1.1.7'
  fast-xml-parser@<5.7.0: '>=5.7.0'
  fflate@>=0.7.0 <0.7.5: 0.7.5
  file-entry-cache@11.1.6: 11.1.5
  flat-cache@6.1.24: 6.1.23
  flatted@<3.4.2: '>=3.4.2'
  h3@<1.15.9: '>=1.15.9'
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  keyv@6.0.0: 5.6.0
  lodash-es@>=4.0.0 <=4.17.22: '>=4.17.23'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  minimatch@<10.2.3: '>=10.2.3'
  nanoid@<3.3.18: 3.3.18
  postcss@<8.5.23: '>=8.5.23'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  seroval: '>=1.4.1'
  simple-git@<3.36.0: '>=3.36.0'
  smol-toml@<=1.7.0: 1.7.1
  svgo@>=4.0.0 <4.1.0: 4.1.0
  uuid@<14.0.0: '>=14.0.0'

patchedDependencies:
  # Twoslash creates a separate hover renderer that doesn't inherit our Shiki
  # options. Keep its syntax colors independent of the runner's wall-clock speed.
  expressive-code-twoslash@0.6.1: patches/expressive-code-twoslash@0.6.1.patch
  # Starlight search must initialize and dispose per element across ClientRouter
  # swaps, not only on DOMContentLoaded (microsoft/aspire.dev#1673).
  '@astrojs/starlight@0.42.0': patches/@astrojs__starlight@0.42.0.patch
  # Temporary network-resilience fix for getMaterialIconsData (falls back to the
  # vendored .starlight-icons cache when the icon-data fetch fails). Remove once
  # https://github.com/Rettend/starlight-plugin-icons/pull/9 is merged & released.
  starlight-plugin-icons@1.1.6: patches/starlight-plugin-icons@1.1.6.patch
